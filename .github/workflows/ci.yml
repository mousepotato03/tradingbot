name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.19
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tradingbot-check .
      - run: docker build -f Dockerfile.browser -t tradingbot-browser-check .
      - run: docker build -f Dockerfile.proxy -t tradingbot-proxy-check .
