[project]
name = "evidence-tradingbot"
version = "0.1.0"
description = "Auditable autonomous investment research"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "openai>=2,<3", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7",
  "playwright>=1.50,<2", "numpy>=2.2,<3",
]

[project.scripts]
tradingbot = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/worker_browser"]

[tool.hatch.build.targets.wheel.force-include]
"docs/reference/stock_research_standard_ko.md" = "app/resources/stock_research_standard_ko.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicitly enabled external service checks"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
